[package]
name = "chess-xray"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native UCI engine observatory"
rust-version = "1.90"

[lib]
name = "chess_xray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
